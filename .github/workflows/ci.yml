name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + xUnit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/ECommerce.sln

      - name: Build
        run: dotnet build backend/ECommerce.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/ECommerce.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (Karma tests + production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (headless Chrome)
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

      - name: Production build
        run: npm run build -- --configuration production

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t luxecart-api:ci backend

      - name: Build frontend image
        run: docker build -t luxecart-frontend:ci frontend
